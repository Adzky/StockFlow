name: stockflow
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
      POSTGRES_DB: stockflow
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro   # runs only on an empty volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./backend/migrations:/migrations:ro"]
    command: ["-path=/migrations", "-database=postgres://stockflow:stockflow@db:5432/stockflow?sslmode=disable", "up"]
    depends_on:
      db: { condition: service_healthy }
  seed:
    image: postgres:17-alpine
    volumes: ["./backend/seed:/seed:ro"]
    command: ["psql", "postgres://stockflow:stockflow@db:5432/stockflow", "-v", "ON_ERROR_STOP=1", "--single-transaction", "-f", "/seed/seed.sql"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://stockflow:stockflow@db:5432/stockflow?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      seed: { condition: service_completed_successfully }
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8080
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
  backend-test:
    image: golang:1.27
    profiles: ["test"]
    working_dir: /src
    volumes:
      - ./backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    environment:
      CGO_ENABLED: "1"
      TEST_DATABASE_URL: postgres://stockflow:stockflow@db:5432/stockflow_test?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    command: ["go", "test", "-race", "-p", "1", "-count=1", "./..."]
volumes:
  pgdata:
  gomod:
  gocache: